###################################################################################################
######################################### Data Attributes #########################################
###################################################################################################

###########################################################
################ Particle Data Attributes #################
###########################################################
attrs/prt:
  title: The full particle data and related diagnostics
  subtitle: subtitle

  # The scenario flattened index of each population
  i_snr/dtype: int64
  i_snr/shape/str: [n_pop]
  i_snr/shape/val: '[n_mypop]'
  i_snr/chunks/val: '[100]'
  i_snr/units: one
  i_snr/long_name: included_snr_idxs_in_my_rank
  i_snr/desc: The scenario flattened index of each population in my rank

  # The scenario x index of each population
  i_x/dtype: int64
  i_x/shape/str: [n_pop]
  i_x/shape/val: '[n_mypop]'
  i_x/chunks/val: '[100]'
  i_x/units: one
  i_x/long_name: included_x_grid_idxs_in_my_rank
  i_x/desc: The scenario x index of each population in my rank

  # The scenario y index of each population
  i_y/dtype: int64
  i_y/shape/str: [n_pop]
  i_y/shape/val: '[n_mypop]'
  i_y/chunks/val: '[100]'
  i_y/units: one
  i_y/long_name: included_y_grid_idxs_in_my_rank
  i_y/desc: The scenario y index of each population in my rank

  # The scenario z index of each population
  i_z/dtype: int64
  i_z/shape/str: [n_pop]
  i_z/shape/val: '[n_mypop]'
  i_z/chunks/val: '[100]'
  i_z/units: one
  i_z/long_name: included_z_grid_idxs_in_my_rank
  i_z/desc: The scenario z index of each population in my rank

  # The time flattened index of each population
  i_t/dtype: int64
  i_t/shape/str: [n_pop]
  i_t/shape/val: '[n_mypop]'
  i_t/chunks/val: '[100]'
  i_t/units: one
  i_t/long_name: included_snr_idxs_in_my_rank
  i_t/desc: The scenario flattened index of each population in my rank

  # The speciated particle mass data
  m_prtchm/dtype: float64
  m_prtchm/shape/str: [n_pop, n_part, n_chem]
  m_prtchm/shape/val: '[n_mypop, n_part, n_chem]'
  m_prtchm/chunks/val: '[1, n_part, n_chem]'
  m_prtchm/units: kg
  m_prtchm/long_name: speciated_particle_mass
  m_prtchm/desc: The mass of each speciated particle in the simulation
  
  # The particle number concentration data
  n_prt/dtype: float64
  n_prt/shape/str: [n_pop, n_part, one]
  n_prt/shape/val: '[n_mypop, n_part, 1]'
  n_prt/chunks/val: '[1, n_part, 1]'
  n_prt/units: none
  n_prt/long_name: particle_number_concentration
  n_prt/desc: The number concentration of each particle in the simulation

  # The particle weight data
  w_prt/dtype: float64
  w_prt/shape/str: [n_pop, n_part, one]
  w_prt/shape/val: '[n_mypop, n_part, 1]'
  w_prt/chunks/val: '[1, n_part, 1]'
  w_prt/units: none
  w_prt/long_name: particle_number_concentration
  w_prt/desc: The weight of each particle in the simulation

  # The total particle number concentration data
  n_tot/dtype: float64
  n_tot/shape/str: [n_pop, one, one]
  n_tot/shape/val: '[n_mypop, 1, 1]'
  n_tot/chunks/val: '[1, 1, 1]'
  n_tot/units: none
  n_tot/long_name: population_total_number_concentration
  n_tot/desc: The total number of particle concentrations in each population 

