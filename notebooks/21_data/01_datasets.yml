  m_prthst/shape/val: "[n_mypop, 1, n_bins]"
  m_prthst/chunks/val: "[1, 1, n_bins]"
  m_prthst/units: kg/m^3
  m_prthst/long_name: total_mass_distribution
  m_prthst/desc: The total mass distribution in kg / m^3

  # The number distribution density values in \# / m^3
  n_prthst/dtype: float64
  n_prthst/shape/str: [n_pop, one, n_bins]
  n_prthst/shape/val: "[n_mypop, 1, n_bins]"
  n_prthst/chunks/val: "[1, 1, n_bins]"
  n_prthst/units: \#/m^3
  n_prthst/long_name: number_distribution
  n_prthst/desc: The number distribution in \# / m^3

