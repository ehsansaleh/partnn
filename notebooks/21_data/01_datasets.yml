###################################################################################################
############################# The BlueWaters Chi Sampling Simulation ##############################
###################################################################################################

###########################################################
##### Variant III: Full Chemicals and Diameter Range ######
###########################################################
# The number of time-steps in the simulation
03_bwchi/n_t: 25
# The simulation grid size
03_bwchi/n_grid: [1000, 1, 1]
# The input datas relative directory
03_bwchi/inp/data_tree: 01_bwchisamp
# The function for obtaining the input `nc_path` and `snridx_nc`
03_bwchi/inp/nc_pathfn: get_bwncpath
# The relative path of the output
03_bwchi/out/h5_tree: 06_prtcls/01_bwchisamp
# The maximum number of netCDF open files at a time
03_bwchi/n_maxfp: 1
# The number of resampled particles within each population
03_bwchi/n_part: 100000
# The chemical species to keep in the particle data
03_bwchi/chem_species: all
# The mini-batch size of aerosol populations for loading the particle data from the disk for diagnostics computations
03_bwchi/diag/n_mb: 100
# The diagnostic hyper-parameters
03_bwchi/diag/hparams/ref: diag/hparams
# The number of particles in the diagnostic input data
03_bwchi/diag/hparams/aerocst/n_part: n_part
# The chemical species names for selecting dust, bc, and so on in opticals and inc nucleation.
03_bwchi/diag/hparams/aerocst/chem_species: chem_species
# The mapping of chemical species (str) to physical density values (float, kg/m^3)
03_bwchi/diag/hparams/aerocst/chem2rho/ref: chem2rho_bwchi
# The mapping of chemical species (str) to physical density values (float, kg/m^3)
03_bwchi/diag/hparams/aerocst/chem2kappa/ref: chem2kappa_bwchi
# The mapping of wave length id (str) to wave length
03_bwchi/diag/hparams/aerocst/wvid2len/ref: wvid2len
# The mapping of chemical species (str) to refractive index values (complex) for optical calculations
03_bwchi/diag/hparams/aerocst/chem2refr/ref: chem2refr_bwchi
# The output file subtitle
03_bwchi/subtitle: >
    This file contains the chemical mass and number concentrations 
    from the PartMC run on the Bluewaters with the chi sampling. All 
    chemical species and the full range of diameters were included 
    in this data.

###########################################################
#### Variant IV: Reduced Chemicals and Diameter Range #####
###########################################################
04_bwchi:
  ref: 03_bwchi
  def:
    # The relative path of the output
    out/h5_tree: 06_prtcls/02_bwchisamp
    # The chemical species to keep in the particle data
    chem_species: SO4,NO3,Cl,NH4,ARO1,ARO2,ALK1,OLE1,API1,Na,OIN,OC,BC,MOC,H2O
    # The number of diameter histogram bins
    diag/hparams/aerohst/n_bins: 19
    # The lower range of the diamter histogram
    diag/hparams/aerohst/diam_low: 10**-8.75
    # The output file subtitle
    subtitle: 
        This file contains the chemical mass and number concentrations 
        from the PartMC run on the Bluewaters with the chi sampling. A 
        reduced subset of chemical species and range of diameters were 
        included in this data.

###########################################################
########## Variant V: Temporary Dry Run Settings ##########
###########################################################
05_bwchi:
  ref: 04_bwchi
  def:
    # The number of resampled particles within each population
    n_part: 1000

###################################################################################################
###################################### The CARES Simulation #######################################
###################################################################################################

###########################################################
##### Variant III: Full Chemicals and Diameter Range ######
###########################################################
# The number of time-steps in the simulation
03_cares/n_t: 9
# The simulation grid size
03_cares/n_grid: [169, 159, 39]
# The input datas relative directory
03_cares/inp/data_tree: 03_caressamp
# The function for obtaining the input `nc_path` and `snridx_nc`
03_cares/inp/nc_pathfn: get_caresncpath
# The relative path of the output
03_cares/out/h5_tree: 06_prtcls/03_caressamp
# The maximum number of netCDF open files at a time
03_cares/n_maxfp: 10
# The number of resampled particles within each population (needs to be specified later)
03_cares/n_part: null
# The chemical species to keep in the particle data
03_cares/chem_species: all
# The mini-batch size of aerosol populations for loading the particle data from the disk for diagnostics computations
03_cares/diag/n_mb: 100
# The diagnostic hyper-parameters
03_cares/diag/hparams/ref: diag/hparams
# The number of particles in the diagnostic input data
03_cares/diag/hparams/aerocst/n_part: n_part
# The chemical species names for selecting dust, bc, and so on in opticals and inc nucleation
03_cares/diag/hparams/aerocst/chem_species: chem_species
# The mapping of chemical species (str) to physical density values (float, kg/m^3)
03_cares/diag/hparams/aerocst/chem2rho/ref: chem2rho_cares
# The mapping of chemical species (str) to physical density values (float, kg/m^3)
03_cares/diag/hparams/aerocst/chem2kappa/ref: chem2kappa_cares
# The mapping of wave length id (str) to wave length
03_cares/diag/hparams/aerocst/wvid2len/ref: wvid2len
# The mapping of chemical species (str) to refractive index values (complex) for optical calculations
03_cares/diag/hparams/aerocst/chem2refr/ref: chem2refr_cares
# The output file subtitle
03_cares/subtitle: >
    This file contains the chemical and number concentrations 
    from the PartMC run on the CARES dataset. All chemical 
    species and the full range of diameters were included in 
    this data.

###########################################################
##### Variant II: Reduced Chemicals and Diameter Range ####
###########################################################
04_cares:
  ref: 03_cares
  def:
    # The relative path of the output
    out/h5_tree: 06_prtcls/04_caressamp
    # The number of resampled particles within each population
    n_part: null
    # The chemical species to keep in the particle data
    chem_species: SO4,Cl,NH4,API1,Na,OC,BC
    # The number of diameter histogram bins
    diag/hparams/aerohst/n_bins: 14
    # The lower range of the diamter histogram
    diag/hparams/aerohst/diam_low: 10**-8.25
    # The higher range of the diamter histogram
    diag/hparams/aerohst/diam_high: 10**-4.75
    # The output file subtitle
    subtitle: >
        This file contains the chemical and number concentrations 
        from the PartMC run on the CARES dataset. A reduced subset 
        of chemical species and range of diameters were included in 
        this data.

