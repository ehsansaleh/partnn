  Na: 0.53
  Ca: 0.53
  OIN: 0.001
  OC: 0.001
  BC: 0.0
  MOC: 0.001
  H2O: 0.0

###########################################################
## The optical wave-lengths and water's refraction index ##
###########################################################
wvid2len:
  300nm: 300e-9
  400nm: 400e-9
  550nm: 550e-9
  600nm: 600e-9
  1000nm: 1e-6

###########################################################
## The chemical refractive indecis of scenarios library ###
###########################################################
chem2refr_bwchitmplt:
  SO4: (1.5+0j)
  NO3: (1.5+0j)
  Cl: (1.5+0j)
  NH4: (1.5+0j)
  MSA: (1.43+0j)
  ARO1: (1.45+0j)
  ARO2: (1.45+0j)
  ALK1: (1.45+0j)
  OLE1: (1.45+0j)
  API1: (1.45+0j)
  API2: (1.45+0j)
  LIM1: (1.45+0j)
  LIM2: (1.45+0j)
  CO3: (1.5+0j)
  Na: (1.5+0j)
  Ca: (1.5+0j)
  OIN: (1.55+0.006j)
  OC: (1.45+0j)
  BC: (1.82+0.74j)
  MOC: (1.5+0j)
  H2O: null

chem2refr_bwchi:
  300nm/ref: chem2refr_bwchitmplt
  300nm/H2O/def: (1.35+1.524e-08j)

  400nm/ref: chem2refr_bwchitmplt
  400nm/H2O/def: (1.34+2.494e-09j)

  550nm/ref: chem2refr_bwchitmplt
  550nm/H2O/def: (1.33+0j)

  600nm/ref: chem2refr_bwchitmplt
  600nm/H2O/def: (1.33+1.638e-09j)

  1000nm/ref: chem2refr_bwchitmplt
  1000nm/H2O/def: (1.33+3.128e-06j)

