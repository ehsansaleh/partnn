  surf_oin/shape/str: [n_pop, n_part, one]
  surf_oin/shape/val: "[n_mypop, n_part, 1]"
  surf_oin/chunks/val: "[1, n_part, 1]"
  surf_oin/units: m^2
  surf_oin/long_name: surface_area_oin
  surf_oin/desc: The dust surface area of each of the particles

  # The black carbon surface area of each of the particles
  surf_bc/dtype: float64
  surf_bc/shape/str: [n_pop, n_part, one]
  surf_bc/shape/val: "[n_mypop, n_part, 1]"
  surf_bc/chunks/val: "[1, n_part, 1]"
  surf_bc/units: m^2
  surf_bc/long_name: surface_area_bc
  surf_bc/desc: The black carbon surface area of each of the particles

###################################################################################################
################################### Diagnostics Hyperparameters ###################################
###################################################################################################
# The global input data type.
diag/hparams/input/type: prt
# The physical processes to be computationally measured
diag/hparams/measures: [m_chmprthst, m_prthst, n_prthst, ccn_cdf, qs_pop, qs_prt, qscs_prt, 
  qa_pop, qa_prt, qacs_prt, frznfrac_tmp, logfrznfrac_tmp]
# The number of diameter histogram bins
diag/hparams/aerohst/n_bins: 20
# The lower range of the diamter histogram
diag/hparams/aerohst/diam_low: 1e-9
# The higher range of the diamter histogram
diag/hparams/aerohst/diam_high: 1e-4
# The evaluation mini-batch size for computing the metric
diag/hparams/aerohst/eval/bs: 512

# The minimum epsilon value for the CDF interval.
diag/hparams/aeroccn/eps_histmin: 1e-3
# The maximum epsilon value for the CDF interval.
diag/hparams/aeroccn/eps_histmax: 1e-1
# The number of bins to divide the log-epsilon interval into.
diag/hparams/aeroccn/n_epshist: 100
# The temperature used to compute the critical relative humidity values; 
# the `A` factor in the computation relies on this temperature.
diag/hparams/aeroccn/tmprtr_sclr: 287.0
# The number of newtonian root finding iterations to compute the critical diameters.
diag/hparams/aeroccn/void_kappa: 0.0
# The number of newtonian root finding iterations to compute the critical diameters.
diag/hparams/aeroccn/n_rfiters: 150
# The relative update size stopping threshold for the newtonian root finder.
diag/hparams/aeroccn/e_rfiters: 1e-10
# The evaluation mini-batch size for computing the metric
diag/hparams/aeroccn/eval/bs: 512
# The input data type for the ccn calculations. One of prt, hst, or null.
diag/hparams/aeroccn/input/type: null
# Whether to be strict about the newton root finding convergence
diag/hparams/aeroccn/strict: true

# The optical wave length for measuring the optical efficiency properties.
diag/hparams/aeroopt/wave_length: [300e-9, 400e-9, 500e-9, 600e-9, 700e-9, 800e-9, 900e-9, 1000e-9]
# The number of iterations needed for the mie sequence summations to converge.
diag/hparams/aeroopt/n_max: 220
# The optical refraction coefficient for particles with zero volume.
diag/hparams/aeroopt/void_refr: "1.5+0.0j"
# Whether the output shapes should be [n_part, n_wave] (true) or [n_wave, n_part] (false)
diag/hparams/aeroopt/trnsps: true
# The evaluation mini-batch size for computing the metric
diag/hparams/aeroopt/eval/bs: 64
# The input data type for the opt calculations. One of prt, hst, or null.
diag/hparams/aeroopt/input/type: null

# The lower end of the the temperature range in Celsius.
# Usually, this value should be around -40 degrees.
diag/hparams/aeroinp/tmprtr_inpmin: -40.0
# The higher end of the the temperature range in Celsius.
# Usually, this value should be around 0 degrees.
diag/hparams/aeroinp/tmprtr_inpmax: 0.0
# The number of temperature bins.
diag/hparams/aeroinp/n_tmprtr: 100
# The evaluation mini-batch size for computing the metric
diag/hparams/aeroinp/eval/bs: 512
# The input data type for the inp calculations. One of prt, hst, or null.
diag/hparams/aeroinp/input/type: null
# Whether the output shapes should be [n_part, 1] (true) or [1, n_part] (false)
diag/hparams/aeroinp/trnsps: true
  
