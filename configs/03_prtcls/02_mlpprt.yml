mplopts/sct5x5/ref: ../02_adhoc/10_utils/08_plt.yml -> mplopts/sct/5x5/dark
mplopts/mbar5x5/ref: ../02_adhoc/10_utils/08_plt.yml -> mplopts/mbar/5x5/dark
mplopts/mbar5x5i/ref: ../02_adhoc/10_utils/08_plt.yml -> mplopts/mbar/5x5i/dark
mplopts/nbar5x5/ref: ../02_adhoc/10_utils/08_plt.yml -> mplopts/nbar/5x5/dark
mplopts/nbar5x5i/ref: ../02_adhoc/10_utils/08_plt.yml -> mplopts/nbar/5x5i/dark
mplopts/blb1x1/ref: ../02_adhoc/10_utils/08_plt.yml -> mplopts/blb/1x1/dark

