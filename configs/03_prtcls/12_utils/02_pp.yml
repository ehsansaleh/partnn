###############################################################################
############################## Histogram Inputs ###############################
###############################################################################

# This is the polynomial pre-processing frame work defined for the aerosol histogram data.
ppmodules/polyhst:
  input:
    m_chmprthst: [n_seeds, n_mb, n_chem, n_bins]
    n_prthst:    [n_seeds, n_mb, 1,      n_bins]

  output: 
    m_chmprtnrm: m09
    m_prthstmag: m05
    n_prthstnrm: n04

  hparams:
    ####################### Mass Related Hyper-Parameters #######################
    # The epsilon added initially to the mass data 
    nrmeps: 1e-100
    # The magnitude dimensionality; one of `'n_chnls', 'n_len', 'one'`.
    magdim: null
    # The magnitude normalization norm
    magpnrm: null
    # The magnitude exponent
    magexp: null
    # Whether to subtract mu3
    magshft: null
    # Whether to scale sig4
    magscl: null
    # The constant epsilon added to the sig04
    magscleps: null
    # The normalized image exponent
    nrmexp: null
    # Whether to subtract mu7
    nrmshft: null
    # Whether to scale sig8
    nrmscl: null
    # The constant epsilon added to the sig08
    nrmscleps: null
    # The mu7 and sig8 dimensionality; one of `'n_chnls', 'n_len', 'one', 'n_chnls, n_len'`.
    nrmscldim: null
    ####################### Count Related Hyper-Parameters ######################
    # The epsilon added to the particle counts
    cnteps: 1000
    # The counts exponent
    cntexp: null
    # Whether to subtract mu2 for the counts
    cntshft: null
    # Whether to scale by sig3 for the counts
    cntscl: null
    # The constant epsilon added to the sig03
    cntscleps: null
    # The mu3 and sig3 dimensionality; one of `'n_len', 'one'`.
    cntscldim: null

  defs:
    # Translating 'on' or 'off' boolean options to True or False
    onoff_dict: {'on': true, 'off': false, true: true, false: false}
    magshft: onoff_dict[magshft]
    magscl: onoff_dict[magscl]
    nrmshft: onoff_dict[nrmshft]
    nrmscl: onoff_dict[nrmscl]
    cntshft: onoff_dict[cntshft]
    cntscl: onoff_dict[cntscl]

    # Translating l1 or l2 to 1 or 2 for the pnorms
    tnsltn_dict1: {1: 1, 2: 2, 'l1': 1, 'l2': 2}
    magpnrm: tnsltn_dict1[magpnrm]

    # The magnitude reduction dimensions
    tnsltn_dict2: {n_chem: [-1], n_chnls: [-1], n_bins: [-2], n_len: [-2], one: [-1, -2]}
    mag_rdcdims: tnsltn_dict2[magdim]

    # The magnitude reduction dimensions
    tnsltn_dict4:  {n_chem: [-1], n_chnls: [-1], n_bins: [-2], n_len: [-2], 
      one: [-1, -2], 'n_chem, n_bins': [], 'n_chnls, n_len': []}
    mu7sig8_rdcdims: tnsltn_dict4[nrmscldim]

    # The counts reduction dimensions
    tnsltn_dict5: {n_bins: [], n_len: [], one: [-1]}
    cnt_rdcdims: tnsltn_dict5[cntscldim]

  layers:
    #######################################
    ######## M1: Adding an Epsilon ########
    #######################################
    # M1 = m0 + nrmeps
    m01:
      type: add
      value: nrmeps
      input: m_chmprthst
      shape: [n_seeds, n_mb, n_chem, n_bins]

    ############################################################
    ################## Part I: The Magnitude ###################
    ############################################################

    #######################################
    #### M2: Taking the Lp-Norm of X1 #####
    #######################################
    # M2 = \| M1 \| 
    m02:
      type: pnorm
      dim: mag_rdcdims
      pnorm: magpnrm
      shape: [n_seeds, n_mb, n_chnlsmag, n_binsmag]

    #######################################
    ## M3: Exponentiating the magnitude ###
    #######################################
    # M3 = M2 ^ alpha
    m03:
      type: sgnpow
      exponent: magexp
      shape: [n_seeds, n_mb, n_chnlsmag, n_binsmag]

    #######################################
    ###### M4: Subtracting the Mean #######
    #######################################
    # magshft = True -> M4 = M3 - mu3
    m04shftd:
      type: shift
      dim: mag_rdcdims
      enable: magshft
      shape: [n_seeds, n_mb, n_chnlsmag, n_binsmag]
    
    # magshft = False -> M4 = M3
    m04:
      type: pipe
      input: '"m04shftd" if magshft else "m03"'
      shape: [n_seeds, n_mb, n_chnlsmag, n_binsmag]

    #######################################
    ####### M5: Dividing the Scale ########
    #######################################
    # magscl = True: M5 = M4 / sigma4
    m05scld:
      type: scale
      dim: mag_rdcdims
      eps: magscleps
      enable: magscl
      shape: [n_seeds, n_mb, n_chnlsmag, n_binsmag]

    # magscl = False -> M5 = M4
    m05:
      type: pipe
      input: '"m05scld" if magscl else "m04"'
      shape: [n_seeds, n_mb, n_chnlsmag, n_binsmag]

    ############################################################
    ################ Part II: The Normalization ################
    ############################################################

    #######################################
    ######### M6: Normalization ###########
    #######################################
    # M6 = M1 / M2
    m06:
      type: normalize
      dim: mag_rdcdims
      pnorm: magpnrm
      input: m01
      shape: [n_seeds, n_mb, n_chem, n_bins]

    #######################################
    ## M7: Exponentiating the normalztn ###
    #######################################
    # M7 = M6 ^ alpha
    m07:
      type: sgnpow
      exponent: nrmexp
      shape: [n_seeds, n_mb, n_chem, n_bins]

    #######################################
    ###### M8: Subtracting the Mean #######
    #######################################
    # nrmshft = True -> M8 = M7 - mu7
    m08shftd:
      type: shift
      dim: mu7sig8_rdcdims
      enable: nrmshft
      shape: [n_seeds, n_mb, n_chem, n_bins]

    # nrmshft = False -> M8 = M7
    m08:
      type: pipe
      input: '"m08shftd" if nrmshft else "m07"'
      shape: [n_seeds, n_mb, n_chem, n_bins]

    #######################################
    ####### M9: Dividing the Scale ########
    #######################################
    # nrmscl = True -> M9 = M8 / sig8
    m09scld:
      type: scale
      dim: mu7sig8_rdcdims
      eps: nrmscleps
      enable: nrmscl
      shape: [n_seeds, n_mb, n_chem, n_bins]

    # nrmscl = False -> M9 = M8
    m09:
      type: pipe
      input: '"m09scld" if nrmscl else "m08"'
      shape: [n_seeds, n_mb, n_chem, n_bins]

    ############################################################
    ################### Part III: The Count ####################
    ############################################################

    #######################################
    ######## N1: Adding an Epsilon ########
    #######################################
    # n1 = n0 + cnteps
    n01:
      type: add
      input: n_prthst
      value: cnteps
      shape: [n_seeds, n_mb, 1, n_bins]

    #######################################
    ## N2: Exponentiating the magnitude ###
    #######################################
    # N2 = N1 ^ alpha
    n02:
      type: sgnpow
      exponent: cntexp
      shape: [n_seeds, n_mb, 1, n_bins]

    #######################################
    ###### N3: Subtracting the Mean #######
    #######################################
    # cntshft = True -> N3 = N2 - mu2
    n03shftd:
      type: shift
      dim: cnt_rdcdims
      enable: cntshft
      shape: [n_seeds, n_mb, 1, n_bins]

    # cntshft = False -> N3 = N2
    n03:
      type: pipe
      input: '"n03shftd" if cntshft else "n02"'
      shape: [n_seeds, n_mb, 1, n_bins]
    
    #######################################
    ####### N4: Dividing the Scale ########
    #######################################
    # cntscl = True -> N4 = N3 / sigma3
    n04scld:
      type: scale
      dim: cnt_rdcdims
      eps: cntscleps
      enable: cntscl
      shape: [n_seeds, n_mb, 1, n_bins]

    # cntscl = False -> N4 = N3
    n04:
      type: pipe
      input: '"n04scld" if cntscl else "n03"'
      shape: [n_seeds, n_mb, 1, n_bins]

# A simple identity preprocessor for the x variables
ppmodules/xidentity:
  input: 
    m_chmprthst: [n_seeds, n_mb, n_chem, n_bins]
    n_prthst:    [n_seeds, n_mb, 1,      n_bins]
  # The outputs are already defined in the layers.
  output: '{}'
  layers:
    m_chmprthstcp: {type: output, input: m_chmprthst, 
      shape: [n_seeds, n_mb, n_chem, n_bins], rename: m_chmprthst}
    n_prthstcp: {type: output, input: n_prthst, 
      shape: [n_seeds, n_mb, 1, n_bins], rename: n_prthst}

# A simple identity preprocessor for the u variables
ppmodules/uidentity:
  input: 
    m_chmprtnrm: [n_seeds, n_mb, n_chem,     n_bins   ]
    m_prthstmag: [n_seeds, n_mb, n_chnlsmag, n_binsmag]
    n_prthstnrm: [n_seeds, n_mb, 1,          n_bins   ]
  # The outputs are already defined in the layers.
  output: '{}'
  layers: 
    m_chmprtnrmcp: {type: output, input: m_chmprtnrm, 
      shape: [n_seeds, n_mb, n_chem, n_bins], rename: m_chmprtnrm}
    m_prthstmagcp: {type: output, input: m_prthstmag, 
      shape: [n_seeds, n_mb, n_chnlsmag, n_binsmag], rename: m_prthstmag}
    n_prthstnrmcp: {type: output, input: n_prthstnrm, 
      shape: [n_seeds, n_mb, 1, n_bins], rename: n_prthstnrm}

# A simple identity preprocessor for the u variables in the y encoders
ppmodules/yuidentity:
  input: 
    yvec: [n_seeds, n_mb, n_chnls, n_len]
  # The outputs are already defined in the layers.
  output: '{}'
  layers: 
    yveccp: 
      type: output
      input: yvec
      shape: [n_seeds, n_mb, n_chnls, n_len]
      rename: yvec

# A label pre-processor to assign OIN "mass fraction" quantile classes for conditional vae.
ppmodules/mfracqntl:
  input:
    m_chmprthst: [n_seeds, n_mb, n_chem, n_bins]
    
  output:
    yvec: l12_qdeschm
  
  hparams:
    # The list of chemical species names
    chem_names: chem_species
    # The mass fraction chemical
    chem_name: OIN
    # The exact number of label classes in the output.
    #   Note: The labels will be imbalanced with non-zero `cdf_low`.
    n_lbls: 4
    # The minimum lowest bin cdf. The bins before the lowest bin will be merged.
    cdf_low: 0.39
    # The output dtype
    dtype: float64
  
  defs:
    # The desired chemical index
    i_chem: chem_names.index(chem_name)

    # Finding the number of bins for the cdf layer. 
    b1: math.ceil((n_lbls - 1) / (1 - cdf_low))
    b2: math.ceil(n_lbls / (1 - cdf_low)) + 1
    cri: >-
      [(abs(math.floor((1 - cdf_low) * ii) + 
        (cdf_low > 0) - n_lbls), ii) 
        for ii in range(b1, b2)]
    
    # The number of bins for the cdf layer
    n_cdfbins: min(cri)[1]
    
    # The number of initial (left) bins which will be merged together
    n_mrgdbins: n_cdfbins - n_lbls

  layers:
    l00_mchmprt:
      type: torch.sum
      input: m_chmprthst
      dim: -1
      keepdim: true
      shape: [n_seeds, n_mb, n_chem, 1]
    
    l01_mfracprt:
      type: normalize
      dim: [-2]
      pnorm: 1
      shape: [n_seeds, n_mb, n_chem, 1]
    
    l02_mdeschm:
      type: select
      dim: -2
      index: i_chem
      shape: [n_seeds, n_mb, 1]
    
    l03_mdeschm:
      type: unsqueeze
      dim: -1
      shape: [n_seeds, n_mb, 1, 1]
    
    l04_qdeschm:
      type: cdf
      dim: []
      bins: n_cdfbins
      frame: data
      domain: [-0.01, 1.01]
      shape: [n_seeds, n_mb, 1, 1]
    
    l05_qdeschm:
      type: mul
      value: n_cdfbins
      shape: [n_seeds, n_mb, 1, 1]
    
    l06_qdeschm:
      type: floor
      shape: [n_seeds, n_mb, 1, 1]
    
    l07_qdeschm:
      type: clamp
      min: n_mrgdbins
      max: n_cdfbins - 1
      shape: [n_seeds, n_mb, 1, 1]

    l08_qdeschm:
      type: add
      value: -n_mrgdbins
      shape: [n_seeds, n_mb, 1, 1]

    l09_qdeschm:
      type: astype
      dtype: long
      shape: [n_seeds, n_mb, 1, 1]

    l10_qdeschm:
      type: torch.nn.functional.one_hot
      num_classes: n_lbls
      shape: [n_seeds, n_mb, 1, 1, n_lbls]

    l11_qdeschm:
      type: astype
      dtype: dtype
      shape: [n_seeds, n_mb, 1, 1, n_lbls]

    l12_qdeschm:
      type: squeeze
      dim: -2
      shape: [n_seeds, n_mb, 1, n_lbls]

# A label pre-processor to assign OIN "absolute mass" quantile classes for conditional vae.
ppmodules/mabsqntl:
  ref: ppmodules/mfracqntl
  def:
    layers/l04_qdeschm/domain: [-1e-9, 1e-4]
  pop: layers/l01_mfracprt

# A label pre-processor to output some physical measurement profiles for conditional vae.
ppmodules/chmhstspecs:
  input:
    m_chmprthst: [n_seeds, n_mb, n_chem, n_bins]
    n_prthst:    [n_seeds, n_mb, 1,      n_bins]

  output:
    yvec: outvec

  hparams:
    # The epsilon added initially to the mass data
    msseps: 1e-100
    # The speciated mass exponent
    mchmexp: null
    # The binned mass exponent
    mhstexp: null
    # The epsilon added to the particle counts
    cnteps: 1000
    # The counts exponent
    cntexp: null
    # The mass scale epsilon
    mssscleps: null
    # The count scale epsilon
    cntscleps: null
    # The conditional variables to be included in the output
    yvars: [mchm, mhst, cnt]
  
  defs:
    en_mchm: "'mchm' in yvars"
    en_mhst: "'mhst' in yvars"
    en_cnt: "'cnt' in yvars"
    en_m01: en_mchm or en_mhst
    outcatinps: "['m09'] * en_mhst + ['m05trnspsd'] * en_mchm + ['n04'] * en_cnt"

  layers:
    #######################################
    ######## M1: Adding an Epsilon ########
    #######################################
    # M1 = m0 + nrmeps
    m01:
      type: add
      value: msseps
      input: m_chmprthst
      enable: en_m01
      shape: [n_seeds, n_mb, n_chem, n_bins]

    ############################################################
    ################# Part I: Per-Species Mass #################
    ############################################################

    #######################################
    ##### M2: Total Mass Per Species ######
    #######################################
    # M2 = M1.sum(dim=-1, keepdim=True)
    m02:
      type: torch.sum
      input: m01
      dim: -1
      keepdim: true
      enable: en_mchm
      shape: [n_seeds, n_mb, n_chem, 1]

    #######################################
    ## M3: Exponentiating the magnitude ###
    #######################################
    # M3 = M2 ^ alpha
    m03:
      type: sgnpow
      exponent: mchmexp
      enable: en_mchm
      shape: [n_seeds, n_mb, n_chem, 1]

    #######################################
    ###### M4: Subtracting the Mean #######
    #######################################
    # M4 = M3 - mu3
    m04:
      type: shift
      dim: []
      enable: en_mchm
      shape: [n_seeds, n_mb, n_chem, 1]

    #######################################
    ####### M5: Dividing the Scale ########
    #######################################
    # M5 = M4 / sigma4
    m05:
      type: scale
      dim: []
      eps: mssscleps
      enable: en_mchm
      shape: [n_seeds, n_mb, n_chem, 1]

    ############################################################
    ################## Part II: Per-Bin Mass ###################
    ############################################################

    #######################################
    ####### M6: Total Mass Per Bin ########
    #######################################
    # M6 = M1.sum(dim=-2, keepdim=True)
    m06:
      type: torch.sum
      input: m01
      dim: -2
      keepdim: true
      enable: en_mhst
      shape: [n_seeds, n_mb, 1, n_bins]

    #######################################
    ##### M7: Exponentiating the Mass #####
    #######################################
    # M7 = M6 ^ alpha
    m07:
      type: sgnpow
      exponent: mhstexp
      enable: en_mhst
      shape: [n_seeds, n_mb, 1, n_bins]

    #######################################
    ###### M8: Subtracting the Mean #######
    #######################################
    # M8 = M7 - mu7
    m08:
      type: shift
      dim: []
      enable: en_mhst
      shape: [n_seeds, n_mb, 1, n_bins]

    #######################################
    ####### M9: Dividing the Scale ########
    #######################################
    # M9 = M8 / sigma8
    m09:
      type: scale
      dim: []
      eps: mssscleps
      enable: en_mhst
      shape: [n_seeds, n_mb, 1, n_bins]

    ############################################################
    ################ Part III: Particle Counts #################
    ############################################################

    #######################################
    ######## N1: Adding an Epsilon ########
    #######################################
    # n1 = n0 + cnteps
    n01:
      type: add
      input: n_prthst
      value: cnteps
      enable: en_cnt
      shape: [n_seeds, n_mb, 1, n_bins]

    #######################################
    ## N2: Exponentiating the magnitude ###
    #######################################
    # N2 = N1 ^ alpha
    n02:
      type: sgnpow
      exponent: cntexp
      enable: en_cnt
      shape: [n_seeds, n_mb, 1, n_bins]

    #######################################
    ###### N3: Subtracting the Mean #######
    #######################################
    # N3 = N2 - mu2
    n03:
      type: shift
      dim: []
      enable: en_cnt
      shape: [n_seeds, n_mb, 1, n_bins]

    #######################################
    ####### N4: Dividing the Scale ########
    #######################################
    # N4 = N3 / sigma3
    n04:
      type: scale
      dim: []
      eps: cntscleps
      enable: en_cnt
      shape: [n_seeds, n_mb, 1, n_bins]

    ############################################################
    ################# Part IV: Concatenations ##################
    ############################################################
    m05flt:
      type: squeeze
      input: m05
      dim: -1
      enable: en_mchm
      shape: [n_seeds, n_mb, n_chem]

    m05trnspsd:
      type: unsqueeze
      dim: -2
      enable: en_mchm
      shape: [n_seeds, n_mb, 1, n_chem]

    outvec:
      type: cat
      input: outcatinps
      dim: -1
      shape: [n_seeds, n_mb, 1, "(n_chem if en_mchm else 0) + (n_bins if en_mhst else 0) + (n_bins if en_cnt else 0)"]

# A label pre-processor to output some physical measurement profiles for conditional vae.
ppmodules/chmhstspecspln:
  ref: ppmodules/chmhstspecs
  def:
    output/m_ychm: m09
    output/m_yhst: m05
    output/n_yhst: n04
  pop:
    - output/yvec
    - layers/m05flt
    - layers/m05trnspsd
    - layers/outvec

# A label pre-processor to output some physical measurement profiles for conditional vae.
ppmodules/brfspecs:
  input:
    m_chmprthst: [n_seeds, n_mb, n_chem, n_bins]
    n_prthst:    [n_seeds, n_mb, 1,      n_bins]

  output:
    yvec: outvec

  hparams:
    # The epsilon added initially to the mass data
    msseps: 1e-100
    # The speciated mass exponent
    mchmexp: null
    # The binned mass exponent
    mhstexp: null
    # The epsilon added to the particle counts
    cnteps: 1000
    # The counts exponent
    cntexp: null
    # The mass scale epsilon
    mssscleps: null
    # The count scale epsilon
    cntscleps: null
    # The list of all chemical species names
    chem_names: chem_species
    # The list of chemical species whose total mass will be included in y
    ychms: [OIN, SO4]  
  
  defs:
    n_ychms: len(ychms)
    i_ychms: "[chem_names.index(chm) for chm in ychms]"

  layers:
    #######################################
    ######## M1: Adding an Epsilon ########
    #######################################
    # M1 = m0 + nrmeps
    m01:
      type: add
      value: msseps
      input: m_chmprthst
      shape: [n_seeds, n_mb, n_chem, n_bins]

    ############################################################
    ################# Part I: Per-Species Mass #################
    ############################################################

    #######################################
    ##### M2: Total Mass Per Species ######
    #######################################
    # M2 = M1.sum(dim=-1, keepdim=True)
    m02:
      type: torch.sum
      input: m01
      dim: [-1, -2]
      keepdim: true
      shape: [n_seeds, n_mb, 1, 1]

    #######################################
    ## M3: Exponentiating the magnitude ###
    #######################################
    # M3 = M2 ^ alpha
    m03:
      type: sgnpow
      exponent: mchmexp
      shape: [n_seeds, n_mb, 1, 1]

    #######################################
    ###### M4: Subtracting the Mean #######
    #######################################
    # M4 = M3 - mu3
    m04:
      type: shift
      dim: []
      shape: [n_seeds, n_mb, 1, 1]

    #######################################
    ####### M5: Dividing the Scale ########
    #######################################
    # M5 = M4 / sigma4
    m05:
      type: scale
      dim: []
      eps: mssscleps
      shape: [n_seeds, n_mb, 1, 1]

    ############################################################
    ################## Part II: Per-Bin Mass ###################
    ############################################################

    #######################################
    ####### M6: Total Mass Per Bin ########
    #######################################
    # M6 = M1.sum(dim=-2, keepdim=True)
    m06:
      type: torch.sum
      input: m01
      dim: -1
      keepdim: true
      shape: [n_seeds, n_mb, n_chem, 1]

    #######################################
    ##### M7: Exponentiating the Mass #####
    #######################################
    # M7 = M6 ^ alpha
    m07:
      type: sgnpow
      exponent: mhstexp
      shape: [n_seeds, n_mb, n_chem, 1]

    #######################################
    ###### M8: Subtracting the Mean #######
    #######################################
    # M8 = M7 - mu7
    m08:
      type: shift
      dim: []
      shape: [n_seeds, n_mb, n_chem, 1]

    #######################################
    ####### M9: Dividing the Scale ########
    #######################################
    # M9 = M8 / sigma8
    m09:
      type: scale
      dim: []
      eps: mssscleps
      shape: [n_seeds, n_mb, n_chem, 1]
    
    m10:
      type: index_select
      dim: -2
      index: i_ychms
      shape: [n_seeds, n_mb, n_ychms, 1]

    m11:
      type: squeeze
      dim: -1
      shape: [n_seeds, n_mb, n_ychms]

    m12:
      type: unsqueeze
      dim: -2
      shape: [n_seeds, n_mb, 1, n_ychms]

    ############################################################
    ################ Part III: Particle Counts #################
    ############################################################

    #######################################
    ######## N1: Adding an Epsilon ########
    #######################################
    # n1 = n0 + cnteps
    n01:
      type: add
      input: n_prthst
      value: cnteps
      shape: [n_seeds, n_mb, 1, n_bins]

    n01b:
      type: torch.sum
      dim: [-1]
      keepdim: true
      shape: [n_seeds, n_mb, 1, 1]


    #######################################
    ## N2: Exponentiating the magnitude ###
    #######################################
    # N2 = N1 ^ alpha
    n02:
      type: sgnpow
      exponent: cntexp
      shape: [n_seeds, n_mb, 1, 1]

    #######################################
    ###### N3: Subtracting the Mean #######
    #######################################
    # N3 = N2 - mu2
    n03:
      type: shift
      dim: []
      shape: [n_seeds, n_mb, 1, 1]

    #######################################
    ####### N4: Dividing the Scale ########
    #######################################
    # N4 = N3 / sigma3
    n04:
      type: scale
      dim: []
      eps: cntscleps
      shape: [n_seeds, n_mb, 1, 1]

    ############################################################
    ################# Part IV: Concatenations ##################
    ############################################################
    outvec:
      type: cat
      input: [m05, n04, m12]
      dim: -1
      shape: [n_seeds, n_mb, 1, n_ychms + 2]

# A label pre-processor to output some physical measurement profiles for conditional vae.
ppmodules/ylowrestrn:
  input:
    m_chmprthst: [n_seeds, n_mb, n_chem, n_bins]
    n_prthst:    [n_seeds, n_mb, 1,      n_bins]

  output:
    yvec: outvec

  hparams:
    # The epsilon added to the mass data
    mssexp: null
    # The epsilon added to the particle counts
    cntexp: null
    # The list of all chemical species names
    chem_names: chem_species
    # The list of inorganic chemical species whose individual masses will be included in y
    ychmsinorg: [SO4, NO3, NH4]
    # The list of organic chemical species whose combined mass will be included in y
    ychmsorgnc: [OC, MOC, ARO1, ARO2, ALK1, OLE1, API1]
    # The number of diameter bins in the output lower-resolution count vector
    n_binslow: null
    # The number of left padding bins of diameter bins for the count
    n_padleft: null
    # The number of right padding bins of diameter bins for the count
    n_padright: null
    # The starting diameter bin index of the SMPS, corresponding to 10nm.
    i1_binsmps: null
    # The ending diameter bin index of the SMPS, corresponding to 560nm.
    i2_binsmps: null
    # The epsilon added to the mass scaling layer
    mssscleps: 0.0
    # The epsilon added to the count scaling layer
    cntscleps: 0.0
  
  defs:
    n_ychmsinorg: len(ychmsinorg)
    n_ychmsorgnc: len(ychmsorgnc)
    n_ychms: n_ychmsinorg + 1
    i_ychmsinorg: "[chem_names.index(chm) for chm in ychmsinorg]"
    i_ychmsorgnc: "[chem_names.index(chm) for chm in ychmsorgnc]"
    pad_bins: "[n_padleft, n_padright]"
    n_pad: n_padleft + n_padright
    n_binssmps: i2_binsmps - i1_binsmps

  layers:
    ############################################################
    ################# Part I: Per-Species Mass #################
    ############################################################

    #######################################
    ######### M0: Non-Negativity ##########
    #######################################
    m00:
      type: torch.clamp
      min: 0
      max: null
      input: m_chmprthst
      shape: [n_seeds, n_mb, n_chem, n_bins]

    #######################################
    ####### M1: Total Species Mass ########
    #######################################
    m01:
      type: torch.sum
      dim: -1
      keepdim: true
      shape: [n_seeds, n_mb, n_chem, 1]

    #######################################
    #### M2: Individual Chem Selection ####
    #######################################
    m02:
      type: index_select
      dim: -2
      index: i_ychmsinorg
      shape: [n_seeds, n_mb, n_ychmsinorg, 1]

    #######################################
    ####### M4: Total Organic Mass ########
    #######################################
    m03:
      type: index_select
      input: m01
      dim: -2
      index: i_ychmsorgnc
      shape: [n_seeds, n_mb, n_ychmsorgnc, 1]

    m04:
      type: torch.sum
      dim: -2
      keepdim: true
      shape: [n_seeds, n_mb, 1, 1]

    #######################################
    ######## M5: ACSM Measurements ########
    #######################################
    m05:
      type: cat
      input: [m02, m04]
      dim: -2
      shape: [n_seeds, n_mb, n_ychms, 1]

    #######################################
    ######## M12: Shift and Scales ########
    #######################################
    m06:
      type: sgnpow
      exponent: mssexp
      shape: [n_seeds, n_mb, n_ychms, 1]

    m07:
      type: shift
      dim: []
      shape: [n_seeds, n_mb, n_ychms, 1]

    m08:
      type: scale
      dim: []
      eps: mssscleps
      shape: [n_seeds, n_mb, n_ychms, 1]

    m09:
      type: reshape
      shape: [n_seeds, n_mb, 1, n_ychms]

    ############################################################
    ################ Part III: Particle Counts #################
    ############################################################

    #######################################
    ######### N0: Non-Negativity ##########
    #######################################
    n00:
      type: torch.clamp
      min: 0
      max: null
      input: n_prthst
      shape: [n_seeds, n_mb, 1, n_bins]

    #######################################
    ###### N1: Slicing to SMPS Range ######
    #######################################
    n01:
      type: slice
      dim: -1
      start: i1_binsmps
      end: i2_binsmps
      shape: [n_seeds, n_mb, 1, n_binssmps]

    #######################################
    ####### N2: Padding with Zeros ########
    #######################################
    n02:
      type: torch.nn.functional.pad
      pad: pad_bins
      mode: constant
      value: 0
      shape: [n_seeds, n_mb, 1, n_binssmps + n_pad]
    
    #######################################
    ## N4: Lowering Diameter Resolution ###
    #######################################
    n03:
      type: reshape
      shape: [n_seeds, n_mb, 1, n_binslow, (n_binssmps + n_pad) // n_binslow]

    n04:
      type: torch.sum
      dim: -1
      shape: [n_seeds, n_mb, 1, n_binslow]

    #######################################
    ######## M12: Shift and Scales ########
    #######################################
    n05:
      type: sgnpow
      exponent: cntexp
      shape: [n_seeds, n_mb, 1, n_binslow]

    n06:
      type: shift
      dim: []
      shape: [n_seeds, n_mb, 1, n_binslow]

    n07:
      type: scale
      dim: []
      eps: cntscleps
      shape: [n_seeds, n_mb, 1, n_binslow]

    ############################################################
    ################# Part IV: Concatenations ##################
    ############################################################
    outvec:
      type: cat
      input: [m09, n07]
      dim: -1
      shape: [n_seeds, n_mb, 1, n_ychms + n_binslow]

# A label pre-processor to output some physical measurement profiles for conditional vae.
ppmodules/ylowrespln:
  ref: ppmodules/ylowrestrn
  def:
    output/m_ychm: m09
    output/n_yhst: n07
  pop:
    - output/yvec
    - layers/outvec

###############################################################################
############################### Particle Inputs ###############################
###############################################################################

# This is the polynomial pre-processing frame work defined for the aerosol particle data.
ppmodules/polyprt:
  input:
    m_prtchm: [n_seeds, n_mb, n_part, n_chem]
    w_prt:    [n_seeds, n_mb, n_part,      1]
    n_tot:    [n_seeds, n_mb,      1,      1]

  output: 
    m_prtchmnrm: m04
    w_prtonenrm: w04
    n_totpopnrm: t04

  hparams:
    ####################### Mass Related Hyper-Parameters #######################
    # The epsilon added initially to the mass data 
    msseps: 1e-100
    # The mass exponent
    mssexp: null
    # Whether to subtract mu3
    mssshft: null
    # Whether to scale sig4
    mssscl: null
    # The constant epsilon added to the sig04
    mssscleps: null
    # The mu3 and sig3 dimensionality; one of `'n_len', 'one'`.
    mssscldim: null
    
    ################### Total Count Related Hyper-Parameters ####################
    # The epsilon added to the particle total counts
    toteps: 1000
    # The total counts exponent
    totexp: null
    # Whether to subtract mu2 for the total counts
    totshft: null
    # Whether to scale by sig3 for the total counts
    totscl: null
    # The constant epsilon added to the sig03
    totscleps: null
    # The p-norm used for calculating the total count scalings
    totsclnrm: null
    
    ####################### Weight Related Hyper-Parameters ######################
    # The epsilon added to the particle weights
    wgteps: 1e-100
    # The weights exponent
    wgtexp: null
    # Whether to subtract mu2 for the weights
    wgtshft: null
    # Whether to scale by sig3 for the weights
    wgtscl: null
    # The constant epsilon added to the sig03
    wgtscleps: null
    # The p-norm used for calculating the Weight scalings
    wgtsclnrm: null

  defs:
    # Translating 'on' or 'off' boolean options to True or False
    onoff_dict: {'on': true, 'off': false, true: true, false: false}
    mssshft: onoff_dict[mssshft]
    mssscl: onoff_dict[mssscl]
    totshft: onoff_dict[totshft]
    totscl: onoff_dict[totscl]
    wgtshft: onoff_dict[wgtshft]
    wgtscl: onoff_dict[wgtscl]

    # The mass and weights reduction dimensions
    tnsltn_dict5: {n_len: [-2], one: [-2, -1]}
    mss_rdcdims: tnsltn_dict5[mssscldim]

  layers:
    ############################################################
    ##################### Part I: The Mass #####################
    ############################################################

    #######################################
    ######## M1: Adding an Epsilon ########
    #######################################
    # M1 = m0 + nrmeps
    m01:
      type: add
      value: msseps
      input: m_prtchm
      shape: [n_seeds, n_mb, n_part, n_chem]

    #######################################
    ## M2: Exponentiating the magnitude ###
    #######################################
    # M2 = M1 ^ alpha
    m02:
      type: sgnpow
      exponent: mssexp
      shape: [n_seeds, n_mb, n_part, n_chem]

    #######################################
    ###### M3: Subtracting the Mean #######
    #######################################
    # mssshft = True -> M3 = M2 - mu2
    m03shftd:
      type: shift
      dim: mss_rdcdims
      enable: mssshft
      shape: [n_seeds, n_mb, n_part, n_chem]
    
    # mssshft = False -> M3 = M2
    m03:
      type: pipe
      input: '"m03shftd" if mssshft else "m02"'
      shape: [n_seeds, n_mb, n_part, n_chem]

    #######################################
    ####### M4: Dividing the Scale ########
    #######################################
    # mssscl = True: M4 = M3 / sigma3
    m04scld:
      type: scale
      dim: mss_rdcdims
      eps: mssscleps
      enable: mssscl
      shape: [n_seeds, n_mb, n_part, n_chem]

    # mssscl = False -> M4 = M3
    m04:
      type: pipe
      input: '"m04scld" if mssscl else "m03"'
      shape: [n_seeds, n_mb, n_part, n_chem]
    
    ############################################################
    ################## Part III: The Weights ###################
    ############################################################

    #######################################
    ######## W1: Adding an Epsilon ########
    #######################################
    # w01 = w01 + wgteps
    w01:
      type: add
      input: w_prt
      value: wgteps
      shape: [n_seeds, n_mb, n_part, 1]

    #######################################
    ## W2: Exponentiating the magnitude ###
    #######################################
    # w02 = w01 ^ alpha
    w02:
      type: sgnpow
      exponent: wgtexp
      shape: [n_seeds, n_mb, n_part, 1]

    #######################################
    ###### W3: Subtracting the Mean #######
    #######################################
    # wgtshft = True -> w03 = w02 - mu2
    w03shftd:
      type: shift
      dim: [-2, -1]
      enable: wgtshft
      shape: [n_seeds, n_mb, n_part, 1]

    # wgtshft = False -> w03 = w2
    w03:
      type: pipe
      input: '"w03shftd" if wgtshft else "w02"'
      shape: [n_seeds, n_mb, n_part, 1]
    
    #######################################
    ####### W4: Dividing the Scale ########
    #######################################
    # wgtscl = True -> w4 = w3 / sigma3
    w04scld:
      type: scale
      dim: [-2, -1]
      eps: wgtscleps
      pnorm: wgtsclnrm
      enable: wgtscl
      shape: [n_seeds, n_mb, n_part, 1]

    # wgtscl = False -> w4 = w3
    w04:
      type: pipe
      input: '"w04scld" if wgtscl else "w03"'
      shape: [n_seeds, n_mb, n_part, 1]

    ############################################################
    ################# Part II: The Total Count #################
    ############################################################

    #######################################
    ######## T1: Adding an Epsilon ########
    #######################################
    # t01 = t01 + toteps
    t01:
      type: add
      input: n_tot
      value: toteps
      shape: [n_seeds, n_mb, 1, 1]

    #######################################
    ## T2: Exponentiating the magnitude ###
    #######################################
    # t02 = t01 ^ alpha
    t02:
      type: sgnpow
      exponent: totexp
      shape: [n_seeds, n_mb, 1, 1]

    #######################################
    ###### T3: Subtracting the Mean #######
    #######################################
    # totshft = True -> t3 = t2 - mu2
    t03shftd:
      type: shift
      dim: [-2, -1]
      enable: totshft
      shape: [n_seeds, n_mb, 1, 1]

    # totshft = False -> t3 = t2
    t03:
      type: pipe
      input: '"t03shftd" if totshft else "t02"'
      shape: [n_seeds, n_mb, 1, 1]
    
    #######################################
    ####### T4: Dividing the Scale ########
    #######################################
    # totscl = True -> t4 = t3 / sigma3
    t04scld:
      type: scale
      dim: [-2, -1]
      eps: totscleps
      pnorm: totsclnrm
      enable: totscl
      shape: [n_seeds, n_mb, 1, 1]

    # totscl = False -> t4 = t3
    t04:
      type: pipe
      input: '"t04scld" if totscl else "t03"'
      shape: [n_seeds, n_mb, 1, 1]

# This is the polynomial pre-processing frame work defined for the aerosol diagnostic data.
ppmodules/polydiag:
  input:
    m_chmprthst:  [n_seeds, n_mb, n_chem, n_bins]
    n_prthst:     [n_seeds, n_mb, 1,      n_bins]
    ccn_cdf:      [n_seeds, n_mb, 1,   n_epshist]
    qs_pop:       [n_seeds, n_mb, 1,      n_wave]
    qa_pop:       [n_seeds, n_mb, 1,      n_wave]
    frznfrac_tmp: [n_seeds, n_mb, 1,    n_tmprtr]
    n_tot:        [n_seeds, n_mb, 1,           1]

  output: 
    m_chmprtnrm: m09
    m_prthstmag: m05
    n_prthstnrm: n04
    c_ccnpopnrm: c05
    s_optpopnrm: s05
    a_optpopnrm: a05
    f_inppopnrm: f05
    n_totpopnrm: t04

  hparams:
    ####################### Mass Related Hyper-Parameters #######################
    # The epsilon added initially to the mass data 
    nrmeps: 1e-100
    # The magnitude dimensionality; one of `'n_chnls', 'n_len', 'one'`.
    magdim: null
    # The magnitude normalization norm
    magpnrm: null
    # The magnitude exponent
    magexp: null
    # Whether to subtract mu3
    magshft: null
    # Whether to scale sig4
    magscl: null
    # The constant epsilon added to the sig04
    magscleps: null
    # The normalized image exponent
    nrmexp: null
    # Whether to subtract mu7
    nrmshft: null
    # Whether to scale sig8
    nrmscl: null
    # The constant epsilon added to the sig08
    nrmscleps: null
    # The mu7 and sig8 dimensionality; one of `'n_chnls', 'n_len', 'one', 'n_chnls, n_len'`.
    nrmscldim: null
    ####################### Count Related Hyper-Parameters ######################
    # The epsilon added to the particle counts
    cnteps: 1000
    # The counts exponent
    cntexp: null
    # Whether to subtract mu2 for the counts
    cntshft: null
    # Whether to scale by sig3 for the counts
    cntscl: null
    # The constant epsilon added to the sig03
    cntscleps: null
    # The mu3 and sig3 dimensionality; one of `'n_len', 'one'`.
    cntscldim: null
    ####################### CCN Related Hyper-Parameters ########################
    # The epsilon added to the ccn spectrum
    ccneps: 0
    # The ccn spectrum exponent
    ccnexp: null
    # Whether to apply a diff (cdf to pdf) operator to the ccn spectrum
    ccndiff: null
    # Whether to subtract mu2 for the ccn spectrum
    ccnshft: null
    # Whether to scale by sig3 for the ccn spectrum
    ccnscl: null
    # The constant epsilon added to the sig03
    ccnscleps: null
    # The mu3 and sig3 dimensionality; one of `'n_len', 'one'`.
    ccnscldim: null
    ################ Optical Scattering Related Hyper-Parameters ################
    # The epsilon added to the optical scattering spectrum
    scteps: 0
    # The optical scattering spectrum exponent
    sctexp: null
    # Whether to apply a diff (cdf to pdf) operator to the scattering spectrum
    sctdiff: null
    # Whether to subtract mu2 for the optical scattering spectrum
    sctshft: null
    # Whether to scale by sig3 for the optical scattering spectrum
    sctscl: null
    # The constant epsilon added to the sig03
    sctscleps: null
    # The mu3 and sig3 dimensionality; one of `'n_len', 'one'`.
    sctscldim: null
    ################ Optical Absorption Related Hyper-Parameters ################
    # The epsilon added to the optical absorption spectrum
    abseps: 0
    # The optical absorption spectrum exponent
    absexp: null
    # Whether to apply a diff (cdf to pdf) operator to the absorption spectrum
    absdiff: null
    # Whether to subtract mu2 for the optical absorption spectrum
    absshft: null
    # Whether to scale by sig3 for the optical absorption spectrum
    absscl: null
    # The constant epsilon added to the sig03
    absscleps: null
    # The mu3 and sig3 dimensionality; one of `'n_len', 'one'`.
    absscldim: null
    ################ Frozen-Fraction Related Hyper-Parameters ################
    # The epsilon added to the frozen fraction spectrum
    inpeps: 0
    # The frozen fraction spectrum exponent
    inpexp: null
    # Whether to apply a diff (cdf to pdf) operator to the frozen fraction spectrum
    inpdiff: null
    # Whether to subtract mu2 for the frozen fraction spectrum
    inpshft: null
    # Whether to scale by sig3 for the frozen fraction spectrum
    inpscl: null
    # The constant epsilon added to the sig03
    inpscleps: null
    # The mu3 and sig3 dimensionality; one of `'n_len', 'one'`.
    inpscldim: null
    ################### Total Count Related Hyper-Parameters ####################
    # The epsilon added to the particle total counts
    toteps: 1000
    # The total counts exponent
    totexp: null
    # Whether to subtract mu2 for the total counts
    totshft: null
    # Whether to scale by sig3 for the total counts
    totscl: null
    # The constant epsilon added to the sig03
    totscleps: null
    # The p-norm used for calculating the total count scalings
    totsclnrm: null

  defs:
    # Translating 'on' or 'off' boolean options to True or False
    onoff_dict: {'on': true, 'off': false, true: true, false: false}
    magshft: onoff_dict[magshft]
    magscl: onoff_dict[magscl]
    nrmshft: onoff_dict[nrmshft]
    nrmscl: onoff_dict[nrmscl]
    cntshft: onoff_dict[cntshft]
    cntscl: onoff_dict[cntscl]
    ccndiff: onoff_dict[ccndiff]
    ccnshft: onoff_dict[ccnshft]
    ccnscl: onoff_dict[ccnscl]
    sctdiff: onoff_dict[sctdiff]
    sctshft: onoff_dict[sctshft]
    sctscl: onoff_dict[sctscl]
    absdiff: onoff_dict[absdiff]
    absshft: onoff_dict[absshft]
    absscl: onoff_dict[absscl]
    inpdiff: onoff_dict[inpdiff]
    inpshft: onoff_dict[inpshft]
    inpscl: onoff_dict[inpscl]
    totshft: onoff_dict[totshft]
    totscl: onoff_dict[totscl]

    # Translating l1 or l2 to 1 or 2 for the pnorms
    tnsltn_dict1: {1: 1, 2: 2, 'l1': 1, 'l2': 2}
    magpnrm: tnsltn_dict1[magpnrm]

    # The magnitude reduction dimensions
    tnsltn_dict2: {n_chem: [-1], n_chnls: [-1], n_bins: [-2], n_len: [-2], one: [-1, -2]}
    mag_rdcdims: tnsltn_dict2[magdim]

    # The magnitude reduction dimensions
    tnsltn_dict4:  {n_chem: [-1], n_chnls: [-1], n_bins: [-2], n_len: [-2], 
      one: [-1, -2], 'n_chem, n_bins': [], 'n_chnls, n_len': []}
    mu7sig8_rdcdims: tnsltn_dict4[nrmscldim]

    # The counts reduction dimensions
    tnsltn_dict5: {n_bins: [], n_len: [], one: [-1]}
    cnt_rdcdims: tnsltn_dict5[cntscldim]
    ccn_rdcdims: tnsltn_dict5[ccnscldim]
    sct_rdcdims: tnsltn_dict5[sctscldim]
    abs_rdcdims: tnsltn_dict5[absscldim]
    inp_rdcdims: tnsltn_dict5[inpscldim]

  layers:
    ############################################################
    ################# Part 0: The Total Count ##################
    ############################################################

    #######################################
    ######## T1: Adding an Epsilon ########
    #######################################
    # t01 = t01 + toteps
    t01:
      type: add
      input: n_tot
      value: toteps
      shape: [n_seeds, n_mb, 1, 1]

    #######################################
    ## T2: Exponentiating the magnitude ###
    #######################################
    # t02 = t01 ^ alpha
    t02:
      type: sgnpow
      exponent: totexp
      shape: [n_seeds, n_mb, 1, 1]

    #######################################
    ###### T3: Subtracting the Mean #######
    #######################################
    # totshft = True -> t3 = t2 - mu2
    t03shftd:
      type: shift
      dim: [-2, -1]
      enable: totshft
      shape: [n_seeds, n_mb, 1, 1]

    # totshft = False -> t3 = t2
    t03:
      type: pipe
      input: '"t03shftd" if totshft else "t02"'
      shape: [n_seeds, n_mb, 1, 1]
    
    #######################################
    ####### T4: Dividing the Scale ########
    #######################################
    # totscl = True -> t4 = t3 / sigma3
    t04scld:
      type: scale
      dim: [-2, -1]
      eps: totscleps
      pnorm: totsclnrm
      enable: totscl
      shape: [n_seeds, n_mb, 1, 1]

    # totscl = False -> t4 = t3
    t04:
      type: pipe
      input: '"t04scld" if totscl else "t03"'
      shape: [n_seeds, n_mb, 1, 1]

    #######################################
    ######## M1: Adding an Epsilon ########
    #######################################
    # M1 = (m_chmprthst + nrmeps) / n_tot
    m00:
      type: add
      value: nrmeps
      input: m_chmprthst
      shape: [n_seeds, n_mb, n_chem, n_bins]

    m01:
      type: layerdiv
      other: n_tot
      shape: [n_seeds, n_mb, n_chem, n_bins]

    ############################################################
    ################## Part I: The Magnitude ###################
    ############################################################

    #######################################
    #### M2: Taking the Lp-Norm of X1 #####
    #######################################
    # M2 = \| M1 \| 
    m02:
      type: pnorm
      dim: mag_rdcdims
      pnorm: magpnrm
      shape: [n_seeds, n_mb, n_chnlsmag, n_binsmag]

    #######################################
    ## M3: Exponentiating the magnitude ###
    #######################################
    # M3 = M2 ^ alpha
    m03:
      type: sgnpow
      exponent: magexp
      shape: [n_seeds, n_mb, n_chnlsmag, n_binsmag]

    #######################################
    ###### M4: Subtracting the Mean #######
    #######################################
    # magshft = True -> M4 = M3 - mu3
    m04shftd:
      type: shift
      dim: mag_rdcdims
      enable: magshft
      shape: [n_seeds, n_mb, n_chnlsmag, n_binsmag]
    
    # magshft = False -> M4 = M3
    m04:
      type: pipe
      input: '"m04shftd" if magshft else "m03"'
      shape: [n_seeds, n_mb, n_chnlsmag, n_binsmag]

    #######################################
    ####### M5: Dividing the Scale ########
    #######################################
    # magscl = True: M5 = M4 / sigma4
    m05scld:
      type: scale
      dim: mag_rdcdims
      eps: magscleps
      enable: magscl
      shape: [n_seeds, n_mb, n_chnlsmag, n_binsmag]

    # magscl = False -> M5 = M4
    m05:
      type: pipe
      input: '"m05scld" if magscl else "m04"'
      shape: [n_seeds, n_mb, n_chnlsmag, n_binsmag]

    ############################################################
    ################ Part II: The Normalization ################
    ############################################################

    #######################################
    ######### M6: Normalization ###########
    #######################################
    # M6 = M1 / M2
    m06:
      type: normalize
      dim: mag_rdcdims
      pnorm: magpnrm
      input: m01
      shape: [n_seeds, n_mb, n_chem, n_bins]

    #######################################
    ## M7: Exponentiating the normalztn ###
    #######################################
    # M7 = M6 ^ alpha
    m07:
      type: sgnpow
      exponent: nrmexp
      shape: [n_seeds, n_mb, n_chem, n_bins]

    #######################################
    ###### M8: Subtracting the Mean #######
    #######################################
    # nrmshft = True -> M8 = M7 - mu7
    m08shftd:
      type: shift
      dim: mu7sig8_rdcdims
      enable: nrmshft
      shape: [n_seeds, n_mb, n_chem, n_bins]

    # nrmshft = False -> M8 = M7
    m08:
      type: pipe
      input: '"m08shftd" if nrmshft else "m07"'
      shape: [n_seeds, n_mb, n_chem, n_bins]

    #######################################
    ####### M9: Dividing the Scale ########
    #######################################
    # nrmscl = True -> M9 = M8 / sig8
    m09scld:
      type: scale
      dim: mu7sig8_rdcdims
      eps: nrmscleps
      enable: nrmscl
      shape: [n_seeds, n_mb, n_chem, n_bins]

    # nrmscl = False -> M9 = M8
    m09:
      type: pipe
      input: '"m09scld" if nrmscl else "m08"'
      shape: [n_seeds, n_mb, n_chem, n_bins]

    ############################################################
    ################### Part III: The Count ####################
    ############################################################

    #######################################
    ######## N1: Adding an Epsilon ########
    #######################################
    # n1 = (n0 + cnteps) / n_tot
    n00:
      type: add
      input: n_prthst
      value: cnteps
      shape: [n_seeds, n_mb, 1, n_bins]

    n01:
      type: layerdiv
      other: n_tot
      shape: [n_seeds, n_mb, 1, n_bins]

    #######################################
    ## N2: Exponentiating the magnitude ###
    #######################################
    # N2 = N1 ^ alpha
    n02:
      type: sgnpow
      exponent: cntexp
      shape: [n_seeds, n_mb, 1, n_bins]

    #######################################
    ###### N3: Subtracting the Mean #######
    #######################################
    # cntshft = True -> N3 = N2 - mu2
    n03shftd:
      type: shift
      dim: cnt_rdcdims
      enable: cntshft
      shape: [n_seeds, n_mb, 1, n_bins]

    # cntshft = False -> N3 = N2
    n03:
      type: pipe
      input: '"n03shftd" if cntshft else "n02"'
      shape: [n_seeds, n_mb, 1, n_bins]
    
    #######################################
    ####### N4: Dividing the Scale ########
    #######################################
    # cntscl = True -> N4 = N3 / sigma3
    n04scld:
      type: scale
      dim: cnt_rdcdims
      eps: cntscleps
      enable: cntscl
      shape: [n_seeds, n_mb, 1, n_bins]

    # cntscl = False -> N4 = N3
    n04:
      type: pipe
      input: '"n04scld" if cntscl else "n03"'
      shape: [n_seeds, n_mb, 1, n_bins]
    
    ############################################################
    ################## Part IV: CCN Spectrum ###################
    ############################################################

    #######################################
    ####### c01: Adding an Epsilon ########
    #######################################
    # c01 = c00 + ccneps
    c01:
      type: add
      input: ccn_cdf
      value: ccneps
      shape: [n_seeds, n_mb, 1, n_epshist]

    #######################################
    ## c02: Exponentiating the magnitude ##
    #######################################
    # c02 = c01 ^ alpha
    c02:
      type: sgnpow
      exponent: ccnexp
      shape: [n_seeds, n_mb, 1, n_epshist]

    #######################################
    ##### c03: Applying Diff Operator #####
    #######################################
    # ccnshft = True -> c03 = diff(c02)
    c03diff:
      type: diff
      dim: -1
      dir: fwd
      enable: ccndiff
      shape: [n_seeds, n_mb, 1, n_epshist]

    # ccnshft = False -> c03 = c02
    c03:
      type: pipe
      input: '"c03diff" if ccndiff else "c02"'
      shape: [n_seeds, n_mb, 1, n_epshist]

    #######################################
    ###### c04: Subtracting the Mean ######
    #######################################
    # ccnshft = True -> c04 = c02 - mu2
    c04shftd:
      type: shift
      dim: ccn_rdcdims
      enable: ccnshft
      shape: [n_seeds, n_mb, 1, n_epshist]

    # ccnshft = False -> c04 = c02
    c04:
      type: pipe
      input: '"c04shftd" if ccnshft else "c03"'
      shape: [n_seeds, n_mb, 1, n_epshist]
    
    #######################################
    ####### C05: Dividing the Scale #######
    #######################################
    # ccnscl = True -> c05 = c03 / sigma3
    c05scld:
      type: scale
      dim: ccn_rdcdims
      eps: ccnscleps
      enable: ccnscl
      shape: [n_seeds, n_mb, 1, n_epshist]

    # ccnscl = False -> c05 = c03
    c05:
      type: pipe
      input: '"c05scld" if ccnscl else "c04"'
      shape: [n_seeds, n_mb, 1, n_epshist]

    ############################################################
    ########### Part V: Optical Scattering Spectrum ############
    ############################################################

    #######################################
    ####### s01: Adding an Epsilon ########
    #######################################
    # s01 = (s00 + scteps) / n_tot
    s00:
      type: add
      input: qs_pop
      value: scteps
      shape: [n_seeds, n_mb, 1, n_wave]
    
    s01:
      type: layerdiv
      other: n_tot
      shape: [n_seeds, n_mb, 1, n_wave]

    #######################################
    ## s02: Exponentiating the magnitude ##
    #######################################
    # s02 = s01 ^ alpha
    s02:
      type: sgnpow
      exponent: sctexp
      shape: [n_seeds, n_mb, 1, n_wave]

    #######################################
    ##### s03: Applying Diff Operator #####
    #######################################
    # sctshft = True -> s03 = diff(s02)
    s03diff:
      type: diff
      dim: -1
      dir: inv
      enable: sctdiff
      shape: [n_seeds, n_mb, 1, n_wave]

    # sctshft = False -> s03 = s02
    s03:
      type: pipe
      input: '"s03diff" if sctdiff else "s02"'
      shape: [n_seeds, n_mb, 1, n_wave]

    #######################################
    ###### s04: Subtracting the Mean ######
    #######################################
    # sctshft = True -> s04 = s03 - mu3
    s04shftd:
      type: shift
      dim: sct_rdcdims
      enable: sctshft
      shape: [n_seeds, n_mb, 1, n_wave]

    # sctshft = False -> s04 = s03
    s04:
      type: pipe
      input: '"s04shftd" if sctshft else "s03"'
      shape: [n_seeds, n_mb, 1, n_wave]
    
    #######################################
    ####### s05: Dividing the Scale #######
    #######################################
    # sctscl = True -> s05 = s04 / sigma4
    s05scld:
      type: scale
      dim: sct_rdcdims
      eps: sctscleps
      enable: sctscl
      shape: [n_seeds, n_mb, 1, n_wave]

    # sctscl = False -> s05 = s04
    s05:
      type: pipe
      input: '"s05scld" if sctscl else "s04"'
      shape: [n_seeds, n_mb, 1, n_wave]
    
    ############################################################
    ########### Part VI: Optical Absorption Spectrum ###########
    ############################################################

    #######################################
    ####### a01: Adding an Epsilon ########
    #######################################
    # a01 = (qa_pop + abseps) / n_tot
    a00:
      type: add
      input: qa_pop
      value: abseps
      shape: [n_seeds, n_mb, 1, n_wave]

    a01:
      type: layerdiv
      other: n_tot
      shape: [n_seeds, n_mb, 1, n_wave]
 
    #######################################
    ## a02: Exponentiating the magnitude ##
    #######################################
    # a02 = a01 ^ alpha
    a02:
      type: sgnpow
      exponent: absexp
      shape: [n_seeds, n_mb, 1, n_wave]

    #######################################
    ##### a03: Applying Diff Operator #####
    #######################################
    # absshft = True -> a03 = diff(a02)
    a03diff:
      type: diff
      dim: -1
      dir: inv
      enable: absdiff
      shape: [n_seeds, n_mb, 1, n_wave]

    # absshft = False -> a03 = a02
    a03:
      type: pipe
      input: '"a03diff" if absdiff else "a02"'
      shape: [n_seeds, n_mb, 1, n_wave]

    #######################################
    ###### a04: Subtracting the Mean ######
    #######################################
    # absshft = True -> a04 = a03 - mu3
    a04shftd:
      type: shift
      dim: abs_rdcdims
      enable: absshft
      shape: [n_seeds, n_mb, 1, n_wave]

    # absshft = False -> a04 = a03
    a04:
      type: pipe
      input: '"a04shftd" if absshft else "a03"'
      shape: [n_seeds, n_mb, 1, n_wave]
    
    #######################################
    ####### a05: Dividing the Scale #######
    #######################################
    # absscl = True -> a05 = a04 / sigma4
    a05scld:
      type: scale
      dim: abs_rdcdims
      eps: absscleps
      enable: absscl
      shape: [n_seeds, n_mb, 1, n_wave]

    # absscl = False -> a05 = a04
    a05:
      type: pipe
      input: '"a05scld" if absscl else "a04"'
      shape: [n_seeds, n_mb, 1, n_wave]

    ############################################################
    ############ Part VII: Frozen Fraction Spectrum ############
    ############################################################

    #######################################
    ####### f01: Adding an Epsilon ########
    #######################################
    # f01 = f00 + inpeps
    f01:
      type: add
      input: frznfrac_tmp
      value: inpeps
      shape: [n_seeds, n_mb, 1, n_tmprtr]

    #######################################
    ## f02: Exponentiating the magnitude ##
    #######################################
    # f02 = f01 ^ alpha
    f02:
      type: sgnpow
      exponent: inpexp
      shape: [n_seeds, n_mb, 1, n_tmprtr]

    #######################################
    ###### f03: Subtracting the Mean ######
    #######################################
    # inpshft = True -> f03 = f02 - mu2
    f03diff:
      type: diff
      dim: -1
      dir: inv
      enable: inpdiff
      shape: [n_seeds, n_mb, 1, n_tmprtr]

    # inpshft = False -> f03 = f02
    f03:
      type: pipe
      input: '"f03diff" if inpdiff else "f02"'
      shape: [n_seeds, n_mb, 1, n_tmprtr]

    #######################################
    ###### f04: Subtracting the Mean ######
    #######################################
    # inpshft = True -> f04 = f03 - mu3
    f04shftd:
      type: shift
      dim: inp_rdcdims
      enable: inpshft
      shape: [n_seeds, n_mb, 1, n_tmprtr]

    # inpshft = False -> f04 = f03
    f04:
      type: pipe
      input: '"f04shftd" if inpshft else "f03"'
      shape: [n_seeds, n_mb, 1, n_tmprtr]
    
    #######################################
    ####### f05: Dividing the Scale #######
    #######################################
    # inpscl = True -> f05 = f04 / sigma4
    f05scld:
      type: scale
      dim: inp_rdcdims
      eps: inpscleps
      enable: inpscl
      shape: [n_seeds, n_mb, 1, n_tmprtr]

    # inpscl = False -> f05 = f04
    f05:
      type: pipe
      input: '"f05scld" if inpscl else "f04"'
      shape: [n_seeds, n_mb, 1, n_tmprtr]

# A simple identity preprocessor for the aerosol diagnostic u variables
ppmodules/udiagidentity:
  input: 
    m_chmprtnrm: [n_seeds, n_mb, n_chem,     n_bins   ]
    m_prthstmag: [n_seeds, n_mb, n_chnlsmag, n_binsmag]
    n_prthstnrm: [n_seeds, n_mb, 1,          n_bins   ]
    c_ccnpopnrm: [n_seeds, n_mb, 1,          n_epshist]
    s_optpopnrm: [n_seeds, n_mb, 1,          n_wave   ]
    a_optpopnrm: [n_seeds, n_mb, 1,          n_wave   ]
    f_inppopnrm: [n_seeds, n_mb, 1,          n_tmprtr ]
  # The outputs are already defined in the layers.
  output: '{}'
  layers: 
    m_chmprtnrmcp: {type: output, input: m_chmprtnrm, 
      shape: [n_seeds, n_mb, n_chem, n_bins], rename: m_chmprtnrm}
    m_prthstmagcp: {type: output, input: m_prthstmag, 
      shape: [n_seeds, n_mb, n_chnlsmag, n_binsmag], rename: m_prthstmag}
    n_prthstnrmcp: {type: output, input: n_prthstnrm, 
      shape: [n_seeds, n_mb, 1, n_bins], rename: n_prthstnrm}
    c_ccnpopnrmcp: {type: output, input: c_ccnpopnrm, 
      shape: [n_seeds, n_mb, 1, n_epshist], rename: c_ccnpopnrm}
    s_optpopnrmcp: {type: output, input: s_optpopnrm, 
      shape: [n_seeds, n_mb, 1, n_wave], rename: s_optpopnrm}
    a_optpopnrmcp: {type: output, input: a_optpopnrm, 
      shape: [n_seeds, n_mb, 1, n_wave], rename: a_optpopnrm}
    f_inppopnrmcp: {type: output, input: f_inppopnrm, 
      shape: [n_seeds, n_mb, 1, n_tmprtr], rename: f_inppopnrm}

